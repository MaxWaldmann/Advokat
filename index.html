<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адвокати Лейб’юк — Вибір варіанту сайту</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #FFFFFF;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.demo-open {
      overflow: hidden;
    }

    .hub {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hub-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 280px));
      gap: 16px;
      width: 100%;
      max-width: 580px;
    }

    .demo-btn {
      appearance: none;
      background: #FFFFFF;
      color: #111111;
      border: 1px solid #DCDCDC;
      border-radius: 6px;
      padding: 20px 22px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .demo-btn:hover {
      border-color: #C5A059;
      background-color: #FAF7F2;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.06);
    }

    .demo-btn:focus-visible {
      outline: 2px solid #C5A059;
      outline-offset: 2px;
    }

    .demo-num {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #C5A059;
      font-weight: 600;
    }

    .demo-title {
      font-size: 16px;
      font-weight: 600;
      color: #111111;
      line-height: 1.3;
    }

    .demo-desc {
      font-size: 13px;
      color: #6B6B6B;
      line-height: 1.4;
    }

    #demo-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #FAF7F2;
      z-index: 1000;
    }

    #demo-frame.active {
      display: block;
    }

    @media (max-width: 540px) {
      .hub-grid {
        grid-template-columns: 1fr;
        max-width: 340px;
      }
    }
  </style>
</head>
<body>
  <main class="hub" id="hub">
    <div class="hub-grid" role="group" aria-label="Вибір варіанту сайту-візитівки">
      <button type="button" class="demo-btn" data-src="demo-1/index.html">
        <span class="demo-num">Варіант 01</span>
        <span class="demo-title">Класичний лендінг</span>
        <span class="demo-desc">Стриманий односторінковий сайт із плавною структурою</span>
      </button>
      <button type="button" class="demo-btn" data-src="demo-2/index.html">
        <span class="demo-num">Варіант 02</span>
        <span class="demo-title">Сайт-презентація</span>
        <span class="demo-desc">Повноекранні слайди з плавними переходами</span>
      </button>
      <button type="button" class="demo-btn" data-src="demo-3/index.html">
        <span class="demo-num">Варіант 03</span>
        <span class="demo-title">Інтерактивний Кодекс</span>
        <span class="demo-desc">Навігатор справи з динамічним підбором адвоката</span>
      </button>
      <button type="button" class="demo-btn" data-src="demo-4/index.html">
        <span class="demo-num">Варіант 04</span>
        <span class="demo-title">Архітектурний Bento Grid</span>
        <span class="demo-desc">Модульна сітка з інтерактивними картками</span>
      </button>
    </div>
  </main>

  <iframe id="demo-frame" title="Перегляд демо-сайту"></iframe>

  <script>
    (function () {
      const frame = document.getElementById('demo-frame');
      const buttons = document.querySelectorAll('.demo-btn');

      function openDemo(src) {
        frame.src = src;
        frame.classList.add('active');
        document.body.classList.add('demo-open');
      }

      function closeDemo() {
        frame.classList.remove('active');
        frame.removeAttribute('src');
        document.body.classList.remove('demo-open');
      }

      window.closeDemo = closeDemo;

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          openDemo(btn.getAttribute('data-src'));
        });
      });

      window.addEventListener('message', function (event) {
        if (event.data === 'EXIT_DEMO' || (event.data && event.data.type === 'EXIT_DEMO')) {
          closeDemo();
        }
      });

      window.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && frame.classList.contains('active')) {
          closeDemo();
        }
      });
    })();
  </script>
</body>
</html>
